<!doctype html><html><body style="margin:0"><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'); c.width=innerWidth; c.height=innerHeight;
const gl=c.getContext('webgl2',{antialias:new URLSearchParams(location.search).has('aa')});
const vs=`#version 300 es
in vec2 p; void main(){gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es
precision highp float; out vec4 o; uniform float t; void main(){ vec2 u=gl_FragCoord.xy; float a=0.; for(int i=0;i<${new URLSearchParams(location.search).get('n')||400};i++){a+=sin(u.x*0.01+float(i)*0.1+t)*cos(u.y*0.01);} o=vec4(fract(a),0.3,0.5,1);}`;
const sh=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);return s;};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const px=new Uint8Array(4); window.frames_=0; window.ms=0;
const mode=new URLSearchParams(location.search).get('mode')||'raf';
function draw(){const t0=performance.now();gl.uniform1f(gl.getUniformLocation(pr,'t'),performance.now()/1000);gl.drawArrays(gl.TRIANGLES,0,3);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);window.ms=performance.now()-t0;window.frames_++;}
if(mode==='raf'){const f=()=>{draw();requestAnimationFrame(f);};f();} else {const f=()=>{draw();setTimeout(f,30);};f();}
</script></body></html>
