<html><head><meta charset="utf-8"><title>Load time</title>

<script type="module">
import { loadCast, cast, makePerson } from '../../src/human/cast3d.js';
const t0 = performance.now();
await loadCast();
const t1 = performance.now();
let n = 0; const per = {};

window.LAB_DONE = true;
</script></body></html>
